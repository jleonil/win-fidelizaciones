<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Asesores - WIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'win-orange': '#FF6B00',
                        'win-orange-dark': '#E65D00',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-premium {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center text-white">

    <div class="glass-panel w-full max-w-md p-8 rounded-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 tracking-wide text-white">IDENTIFICACIÓN DE USUARIO</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-4 rounded-xl {% if category == 'error' %}bg-red-500/20 text-red-200 border border-red-500/30{% else %}bg-green-500/20 text-green-200 border border-green-500/30{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label for="correo" class="block text-sm font-medium text-slate-300 mb-2">Correo Electrónico</label>
                <input type="email" name="correo" id="correo" required 
                    class="input-premium w-full px-4 py-3 rounded-xl"
                    placeholder="ejemplo@win.pe"
                    value="{{ remember_email }}">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
                <input type="password" name="password" id="password" required 
                    class="input-premium w-full px-4 py-3 rounded-xl"
                    placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox" {% if remember_email %}checked{% endif %} class="h-4 w-4 rounded border-slate-600 bg-slate-700 text-win-orange focus:ring-win-orange focus:ring-offset-slate-900">
                    <label for="remember_me" class="ml-2 block text-sm text-slate-300">
                        Recordar usuario
                    </label>
                </div>
            </div>

            <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-win-orange hover:bg-win-orange-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-win-orange focus:ring-offset-slate-900 transition-colors">
                INGRESAR
            </button>
            
            <button type="button" onclick="alert('Por favor, contacta a tu Supervisor o Administrador para restablecer tu contraseña.')"
                class="w-full flex justify-center py-3 px-4 border border-slate-500 rounded-xl shadow-sm text-sm font-medium text-slate-300 bg-transparent hover:bg-slate-800 focus:outline-none transition-colors mt-4">
                OLVIDÉ MI CONTRASEÑA
            </button>
        </form>
        
        <div class="mt-6 text-center text-xs text-slate-500">
            &copy; 2026 WIN. Uso corporativo exclusivo.
        </div>
    </div>

</body>
</html>
